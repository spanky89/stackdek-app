<!doctype html>
<html>
  <body style="margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#171717">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation">
      <tr><td align="center" style="padding:40px 16px">
        <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="max-width:560px;background:#fff;border:1px solid #e5e5e5;border-radius:16px">
          <tr><td style="padding:32px">
            <div style="font-size:24px;font-weight:700;margin-bottom:28px">StackDek</div>
            <h1 style="font-size:24px;margin:0 0 12px">Confirm your StackDek account</h1>
            <p style="font-size:16px;line-height:1.6;color:#525252;margin:0 0 24px">
              Confirm your email to finish creating your secure StackDek workspace for time tracking, assigned jobs, and hours.
            </p>
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#171717;color:#fff;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:10px">Confirm My Account</a>
            <p style="font-size:12px;line-height:1.5;color:#737373;margin:28px 0 0">
              If the button does not work, copy this link:<br>
              <a href="{{ .ConfirmationURL }}" style="color:#404040;word-break:break-all">{{ .ConfirmationURL }}</a>
            </p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
